[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-sample"
version = "0.1.0"
description = "Load, chunk, and embed local text documents in Chroma."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4,<2",
    "langchain-chroma>=1.1.0,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-core>=1.6.11,<2",
    "langchain-openai>=1.7.2,<2",
    "langchain-text-splitters>=1.1.3,<2",
]

[project.scripts]
rag-ingest = "rag_sample.ingestion_pipeline:main"
rag-retrieve = "rag_sample.retrieval_pipeline:main"

[tool.setuptools]
packages = ["rag_sample"]
